version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Holtech
# Sobe: PostgreSQL + API FastAPI
#
# Uso:
#   docker compose up --build          # sobe tudo
#   docker compose up --build -d       # sobe em background
#   docker compose down                # derruba tudo
#   docker compose down -v             # derruba e remove volumes (apaga dados)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: holtech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-login_holtech}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-17212931}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-login_holtech}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (FastAPI) ────────────────────────────────────────────────────────────
  holtech_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: holtech_api
    restart: unless-stopped
    environment:
      TIPO_BANCO:  ${TIPO_BANCO:-0}
      DB_HOST:     postgres
      DB_PORT:     ${DB_PORT:-5432}
      DB_NAME:     ${DB_NAME:-login_holtech}
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-17212931}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"   # FastAPI / Swagger
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/db.json:/app/db.json

volumes:
  postgres_data:
    name: holtech_postgres_data
